<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delhi Metro Route Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--ink:#172235;--muted:#667085;--line:#e6eaf0;--panel:#fff;--bg:#f4f6f9;--accent:#152f55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{background:#102846;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;color:#c7d4e4;font-size:12px}.status{font-size:12px;color:#d4e6d7}.wrap{max-width:1440px;margin:0 auto;padding:22px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px;gap:15px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#63748a;font-weight:700;font-size:10px}.intro h2{margin:4px 0 3px;font-size:25px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted)}.pill{border:1px solid #dbe3ed;background:white;border-radius:30px;padding:8px 12px;color:#43536a;font-size:12px;white-space:nowrap}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:stretch}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 4px 16px #1e293b08}.sidebar{padding:18px}.panel-title{font-size:14px;font-weight:750;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin:0 0 17px}.field{position:relative;margin:13px 0}.field label{display:block;font-size:11px;font-weight:750;color:#56657a;margin-bottom:6px}.field input{width:100%;border:1px solid #dce2ea;border-radius:9px;padding:11px 12px;font:inherit;outline:none;background:#fff}.field input:focus{border-color:#456a9e;box-shadow:0 0 0 3px #456a9e1c}.suggestions{position:absolute;z-index:800;left:0;right:0;top:100%;background:white;border:1px solid #dce2ea;border-radius:9px;box-shadow:0 10px 28px #0d20341a;max-height:220px;overflow:auto}.suggestion{padding:9px 11px;cursor:pointer;border-bottom:1px solid #f0f2f5}.suggestion:hover{background:#f4f7fb}.suggestion small{display:block;color:#718096;margin-top:2px}.actions{display:flex;gap:8px;margin-top:16px}.btn{border:0;border-radius:9px;padding:11px 13px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#183b67;color:white;flex:1}.primary:hover{background:#224e83}.secondary{background:#f0f3f7;color:#35445a}.btn:disabled{opacity:.55;cursor:wait}.feedback{margin-top:12px;color:#526176;font-size:12px;min-height:18px}.feedback.error{color:#b42318}.result{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#f6f8fb;border:1px solid #edf0f4;border-radius:10px;padding:11px}.metric b{display:block;font-size:20px;letter-spacing:-.04em}.metric span{font-size:11px;color:var(--muted)}.taglist{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 13px}.tag{padding:5px 8px;border-radius:20px;background:#f0f3f7;color:#334155;font-size:11px}.interchange{background:#fff8e8;border:1px solid #f5e4b9;padding:9px 10px;border-radius:8px;font-size:12px;margin:7px 0}.sequence{list-style:none;margin:13px 0 0;padding:0;max-height:340px;overflow:auto}.sequence li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0f2f5}.num{width:22px;height:22px;border-radius:50%;background:#e9eef5;display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0}.sequence li:first-child .num,.sequence li:last-child .num{background:#183b67;color:white}.sequence strong{display:block;font-size:12px}.sequence small{color:#6a7789;font-size:11px}.map-panel{overflow:hidden;min-height:700px;position:relative}.map-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.map-head b{font-size:13px}.map-head span{font-size:11px;color:var(--muted)}#map{height:calc(100% - 54px);min-height:646px;background:#e9eef3}.legend{position:absolute;z-index:500;bottom:16px;left:16px;background:#fffef8ed;border:1px solid #dce2e9;border-radius:10px;padding:10px 12px;box-shadow:0 2px 10px #1e293b16;max-width:250px}.legend-title{font-size:10px;font-weight:800;text-transform:uppercase;color:#5c687a;margin-bottom:7px}.legend-item{display:inline-flex;align-items:center;gap:5px;font-size:10px;margin:3px 8px 3px 0}.swatch{width:16px;height:4px;border-radius:4px;display:inline-block}.notice{font-size:10px;color:#6f7b8c;padding:12px 0 0}.leaflet-popup-content{font-size:12px}.map-marker{border-radius:50%;background:#fff;border:2px solid #334155;box-shadow:0 1px 5px #0003}.route-dot{border-color:#102846;background:#ffdc5e}.empty{color:#738094;font-size:12px;padding:15px 0}.footer{color:#7b8797;font-size:11px;padding:16px 2px}.mobile-toggle{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.map-panel{min-height:560px}#map{min-height:500px}.intro{align-items:start;flex-direction:column}.wrap{padding:13px}.topbar{padding:14px}.map-panel{order:2}}@media(max-width:520px){.brand h1{font-size:15px}.status{display:none}.map-head{align-items:start;flex-direction:column}.map-panel{min-height:470px}#map{min-height:410px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
function App(){const [network,setNetwork]=useState(null),[source,setSource]=useState(''),[destination,setDestination]=useState(''),[active,setActive]=useState(''),[query,setQuery]=useState(''),[matches,setMatches]=useState([]),[route,setRoute]=useState(null),[busy,setBusy]=useState(false),[message,setMessage]=useState('Loading metro network…'),[error,setError]=useState(false);const mapRef=useRef(null),layersRef=useRef({network:[],route:[],markers:[]}),mapObj=useRef(null);
useEffect(()=>{fetch('/api/network').then(r=>{if(!r.ok)throw Error('Could not load network');return r.json()}).then(d=>{setNetwork(d);setMessage('Select two stations to plan a route.');setTimeout(initMap,50)}).catch(e=>{setMessage('Could not load network. Restart the app and try again.');setError(true)});},[]);
function initMap(){if(mapObj.current||!mapRef.current||!window.L)return;const map=L.map(mapRef.current,{zoomControl:true}).setView([28.62,77.19],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);mapObj.current=map;}
useEffect(()=>{if(!network)return;if(!mapObj.current)initMap();if(!mapObj.current)return;const map=mapObj.current;layersRef.current.network.forEach(l=>map.removeLayer(l));layersRef.current.markers.forEach(l=>map.removeLayer(l));const newLayers=[],newMarkers=[];Object.entries(network.lines).forEach(([name,line])=>{const pts=(line.shape&&line.shape.length>1)?line.shape:line.stations.map(n=>network.stations.find(s=>s.name===n)).filter(Boolean).map(s=>[s.lat,s.lon]);if(pts.length>1)newLayers.push(L.polyline(pts,{color:line.color,weight:4,opacity:.72}).addTo(map));});network.stations.forEach(s=>{const m=L.circleMarker([s.lat,s.lon],{radius:s.lines.length>1?5:3,color:s.lines.length>1?'#142b48':'#fff',weight:s.lines.length>1?2:1,fillColor:s.lines.length>1?'#ffcf4a':'#50657e',fillOpacity:.95}).bindPopup(`<b>${s.name}</b><br>${s.lines.join(' · ')}`).addTo(map);newMarkers.push(m)});layersRef.current.network=newLayers;layersRef.current.markers=newMarkers;map.invalidateSize();},[network]);
useEffect(()=>{if(!network||!mapObj.current)return;const map=mapObj.current;layersRef.current.route.forEach(l=>map.removeLayer(l));layersRef.current.route=[];if(!route)return;const points=route.stations.map(s=>[s.lat,s.lon]);if(points.length>1){const line=L.polyline(points,{color:'#132c4d',weight:8,opacity:.92}).addTo(map);const inner=L.polyline(points,{color:'#ffcf4a',weight:4,opacity:1}).addTo(map);layersRef.current.route.push(line,inner);route.stations.forEach((s,i)=>{const m=L.circleMarker([s.lat,s.lon],{radius:i===0||i===route.stations.length-1?8:5,color:'#142b48',weight:2,fillColor:i===0||i===route.stations.length-1?'#ffcf4a':'#fff',fillOpacity:1}).bindPopup(`<b>${i+1}. ${s.name}</b><br>${s.lines.join(' · ')}`).addTo(map);layersRef.current.route.push(m)});map.fitBounds(line.getBounds(),{padding:[35,35],maxZoom:13});}},[route,network]);
useEffect(()=>{if(!active||query.trim().length<1){setMatches([]);return}let cancel=false;const t=setTimeout(()=>fetch('/api/stations/search?q='+encodeURIComponent(query)).then(r=>r.json()).then(d=>{if(!cancel)setMatches(d.results||[])}).catch(()=>setMatches([])),100);return()=>{cancel=true;clearTimeout(t)}},[query,active]);
function edit(which){setActive(which);setQuery(which==='source'?source:destination);setMatches([])}function choose(s){if(active==='source')setSource(s.name);else setDestination(s.name);setActive('');setMatches([]);setRoute(null);setMessage('Stations selected. Find your route when ready.');setError(false)}
async function findRoute(e){e?.preventDefault();setError(false);setRoute(null);if(!source){setMessage('Please select a source station.');setError(true);return}if(!destination){setMessage('Please select a destination station.');setError(true);return}if(source===destination){setMessage('Choose two different stations.');setError(true);return}setBusy(true);setMessage('Calculating minimum-time route…');try{const r=await fetch('/api/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source,destination})});const d=await r.json();if(!r.ok)throw Error(d.error||'Route request failed');setRoute(d);setMessage('Route found. The map and summary are synchronised.')}catch(err){setMessage(err.message);setError(true)}finally{setBusy(false)}}
function clearAll(){setSource('');setDestination('');setRoute(null);setActive('');setMatches([]);setMessage('Select two stations to plan a route.');setError(false);if(mapObj.current)mapObj.current.setView([28.62,77.19],10)}
return <><header className="topbar"><div className="brand"><div className="logo">DM</div><div><h1>Delhi Metro Route Planner</h1><p>Interactive route planning and network visualisation</p></div></div><div className="status">● Local route engine ready</div></header><main className="wrap"><div className="intro"><div><div className="eyebrow">The Design Fellowship · CS-3810</div><h2>Plan your journey.</h2><p>Find a minimum-estimated-time route across metro lines.</p></div><div className="pill">Dijkstra · Weighted graph · Leaflet map</div></div><div className="layout"><section className="panel sidebar"><h3 className="panel-title">Journey planner</h3><p className="sub">Search and select stations from the network.</p><div className="field"><label>FROM · SOURCE STATION</label><input value={active==='source'?query:source} onFocus={()=>edit('source')} onChange={e=>{setActive('source');setQuery(e.target.value)}} placeholder="Search source station…" autoComplete="off"/>{active==='source'&&matches.length>0&&<div className="suggestions">{matches.map(s=><div className="suggestion" key={s.name} onMouseDown={()=>choose(s)}>{s.name}<small>{s.lines.join(' · ')}</small></div>)}</div>}</div><div className="field"><label>TO · DESTINATION STATION</label><input value={active==='destination'?query:destination} onFocus={()=>edit('destination')} onChange={e=>{setActive('destination');setQuery(e.target.value)}} placeholder="Search destination station…" autoComplete="off"/>{active==='destination'&&matches.length>0&&<div className="suggestions">{matches.map(s=><div className="suggestion" key={s.name} onMouseDown={()=>choose(s)}>{s.name}<small>{s.lines.join(' · ')}</small></div>)}</div>}</div><div className="actions"><button className="btn primary" onClick={findRoute} disabled={busy}>{busy?'Calculating…':'Find route →'}</button><button className="btn secondary" onClick={clearAll}>Clear</button></div><div className={'feedback '+(error?'error':'')}>{message}</div>{route?<div className="result"><h3 className="panel-title">Your journey</h3><p className="sub">Estimated journey details</p><div className="metrics"><div className="metric"><b>{Math.round(route.travel_time_minutes)} min</b><span>Estimated travel time</span></div><div className="metric"><b>{route.stations.length-1}</b><span>Station-to-station legs</span></div></div><div style={{marginTop:14,fontSize:11,fontWeight:750}}>LINES USED</div><div className="taglist">{route.lines.map(n=><span className="tag" key={n} style={{borderLeft:'4px solid '+network.lines[n].color}}>{n}</span>)}</div>{route.interchanges.length>0&&<><div style={{fontSize:11,fontWeight:750}}>CHANGE LINES AT</div>{route.interchanges.map((x,i)=><div className="interchange" key={i}><b>{x.station}</b><br/>Change from {x.from_line} to {x.to_line}</div>)}</>}<div style={{marginTop:14,fontSize:11,fontWeight:750}}>STATION SEQUENCE</div><ol className="sequence">{route.stations.map((s,i)=><li key={s.name+'-'+i}><span className="num">{i+1}</span><div><strong>{s.name}</strong><small>{i===0?'Start':i===route.stations.length-1?'Destination':s.lines.filter(n=>route.lines.includes(n)).join(' · ')}</small></div></li>)}</ol></div>:<div className="result"><h3 className="panel-title">Route details</h3><div className="empty">Your estimated journey time, line changes, and station-by-station directions will appear here.</div></div>}<div className="notice">Travel times are derived from the supplied GTFS schedule and include an estimated interchange penalty. The feed's service calendar ends in 2025; this is not live service information.</div></section><section className="panel map-panel"><div className="map-head"><b>Metro network map</b><span>{network?`${network.stations.length} stations · ${Object.keys(network.lines).length} route entries`:'Loading network…'} · Pan and zoom</span></div><div id="map" ref={mapRef}></div><div className="legend"><div className="legend-title">Metro lines</div>{network&&Object.entries(network.lines).map(([n,l])=><span className="legend-item" key={n}><i className="swatch" style={{background:l.color}}></i>{n}</span>)}<div style={{fontSize:10,color:'#6c7787',marginTop:5}}>Highlighted route uses a dark outline and yellow centre.</div></div></section></div><div className="footer">The Design Fellowship · Delhi Metro Route Planner and Visualiser · GTFS feed supplied for this project; schedule-derived estimates, not live information.</div></main></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
